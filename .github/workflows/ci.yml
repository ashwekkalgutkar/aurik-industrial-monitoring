name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Static Type Checker
        run: mypy app/ tests/

  test:
    name: Integration & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aurik_monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/aurik_monitoring
          APP_ENV: testing
          ENVIRONMENT: testing
          API_KEY_INGEST: aurik-ingest-secret-key-prod-001
          API_KEY_READ: aurik-read-secret-key-prod-002
          API_KEY_ADMIN: aurik-admin-secret-key-prod-003
        run: pytest -v

  docker-build:
    name: Docker Multi-Stage Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Runner Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: false
          tags: aurik-api:latest

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          push: false
          tags: aurik-api:test
