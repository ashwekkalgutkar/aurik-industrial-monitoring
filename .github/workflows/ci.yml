name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Static Type Checker
        run: mypy app/ tests/ scripts/

  test:
    name: Integration & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aurik_monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/aurik_monitoring
          APP_ENV: testing
          ENVIRONMENT: testing
          API_KEY_INGEST: aurik-ingest-secret-key-prod-001
          API_KEY_READ: aurik-read-secret-key-prod-002
          API_KEY_ADMIN: aurik-admin-secret-key-prod-003
        run: pytest -v

  docker-build:
    name: Docker Multi-Stage Build & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Runner Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: aurik-api:latest

      - name: Verify No Development Dependencies in Runtime Image
        run: |
          docker run --rm aurik-api:latest pip list > runtime_pip_list.txt
          cat runtime_pip_list.txt
          for pkg in pytest ruff mypy httpx; do
            if grep -qi "^$pkg " runtime_pip_list.txt; then
              echo "Error: Development dependency '$pkg' found in production runtime image!"
              exit 1
            fi
          done
          echo "Verified: runtime image contains zero development dependencies."

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          push: false
          tags: aurik-api:test

  docker-compose-smoke:
    name: Docker Compose Smoke & Anchor Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy Environment Configuration
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_INGEST_KEY_PROD_MIN_24_CHARS/aurik-ingest-secret-key-prod-001/g' .env
          sed -i 's/CHANGE_ME_READ_KEY_PROD_MIN_24_CHARS/aurik-read-secret-key-prod-002/g' .env
          sed -i 's/CHANGE_ME_ADMIN_KEY_PROD_MIN_24_CHARS/aurik-admin-secret-key-prod-003/g' .env

      - name: Start Services with Docker Compose
        run: docker compose up -d --build --wait

      - name: Verify Health and Readiness Endpoints
        run: |
          curl -sf http://localhost:8000/healthz | grep -q '"status":"ok"'
          curl -sf http://localhost:8000/readyz | grep -q '"status":"ready"'
          echo "Health and Readiness endpoints verified."

      - name: Seed Database
        run: docker compose exec -T api python -m app.cli seed

      - name: Run Independent Anchor Verification
        run: docker compose exec -T api python scripts/verify_anchors.py

      - name: Tear Down Docker Compose
        if: always()
        run: docker compose down -v
