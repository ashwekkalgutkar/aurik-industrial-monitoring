services:
  postgres:
    image: postgres:16-alpine
    container_name: aurik_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-aurik_monitoring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aurik_monitoring}"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: aurik_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgrespassword@postgres:5432/aurik_monitoring}
      APP_ENV: ${APP_ENV:-production}
      API_KEY_INGEST: ${API_KEY_INGEST:-aurik-ingest-secret-key-prod-001}
      API_KEY_READ: ${API_KEY_READ:-aurik-read-secret-key-prod-002}
      API_KEY_ADMIN: ${API_KEY_ADMIN:-aurik-admin-secret-key-prod-003}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: aurik_api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgrespassword@postgres:5432/aurik_monitoring}
      APP_ENV: ${APP_ENV:-production}
      API_KEY_INGEST: ${API_KEY_INGEST:-aurik-ingest-secret-key-prod-001}
      API_KEY_READ: ${API_KEY_READ:-aurik-read-secret-key-prod-002}
      API_KEY_ADMIN: ${API_KEY_ADMIN:-aurik-admin-secret-key-prod-003}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-5242880}
      ALERT_TTL_MINUTES: ${ALERT_TTL_MINUTES:-120}
      FRESHNESS_MINUTES: ${FRESHNESS_MINUTES:-30}
      VENDOR_CONFLICT_WINDOW_MINUTES: ${VENDOR_CONFLICT_WINDOW_MINUTES:-5}
      TEMP_NEAR_LIMIT_RATIO: ${TEMP_NEAR_LIMIT_RATIO:-0.90}
      VIB_NEAR_LIMIT_RATIO: ${VIB_NEAR_LIMIT_RATIO:-0.85}
      SENSOR_QUALITY_MIN: ${SENSOR_QUALITY_MIN:-0.50}
      POWER_DEVIATION_PCT: ${POWER_DEVIATION_PCT:-20.0}
      DEFAULT_ASSUMED_TIMEZONE: ${DEFAULT_ASSUMED_TIMEZONE:-UTC}
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\")'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: aurik_worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgrespassword@postgres:5432/aurik_monitoring}
      APP_ENV: ${APP_ENV:-production}
      API_KEY_INGEST: ${API_KEY_INGEST:-aurik-ingest-secret-key-prod-001}
      API_KEY_READ: ${API_KEY_READ:-aurik-read-secret-key-prod-002}
      API_KEY_ADMIN: ${API_KEY_ADMIN:-aurik-admin-secret-key-prod-003}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-0.5}
      ALERT_TTL_MINUTES: ${ALERT_TTL_MINUTES:-120}
      FRESHNESS_MINUTES: ${FRESHNESS_MINUTES:-30}
      VENDOR_CONFLICT_WINDOW_MINUTES: ${VENDOR_CONFLICT_WINDOW_MINUTES:-5}
      TEMP_NEAR_LIMIT_RATIO: ${TEMP_NEAR_LIMIT_RATIO:-0.90}
      VIB_NEAR_LIMIT_RATIO: ${VIB_NEAR_LIMIT_RATIO:-0.85}
      SENSOR_QUALITY_MIN: ${SENSOR_QUALITY_MIN:-0.50}
      POWER_DEVIATION_PCT: ${POWER_DEVIATION_PCT:-20.0}
      DEFAULT_ASSUMED_TIMEZONE: ${DEFAULT_ASSUMED_TIMEZONE:-UTC}
    command: ["python", "-m", "app.workers.runner"]
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: aurik_seed
    profiles:
      - seed
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgrespassword@postgres:5432/aurik_monitoring}
      APP_ENV: ${APP_ENV:-production}
      API_KEY_INGEST: ${API_KEY_INGEST:-aurik-ingest-secret-key-prod-001}
      API_KEY_READ: ${API_KEY_READ:-aurik-read-secret-key-prod-002}
      API_KEY_ADMIN: ${API_KEY_ADMIN:-aurik-admin-secret-key-prod-003}
    command: ["python", "-m", "app.cli", "seed"]
    restart: "no"

volumes:
  postgres_data:
